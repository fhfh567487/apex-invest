<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Apex - Telegram Integration</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .telegram-widget {
            background: linear-gradient(135deg, rgba(0, 136, 204, 0.12) 0%, rgba(15, 23, 42, 0.8) 100%);
            border: 1px solid rgba(0, 136, 204, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 24px;
            max-width: 480px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .tg-icon {
            background: rgba(0, 136, 204, 0.2);
            padding: 14px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .tg-content h3 {
            margin: 0 0 6px 0;
            font-size: 1.15rem;
            color: #ffffff;
        }

        .tg-content p {
            margin: 0;
            font-size: 0.88rem;
            color: #94a3b8;
            line-height: 1.4;
        }

        .btn-apex-tg {
            background: #0088cc;
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
            margin-top: 12px;
        }

        .btn-apex-tg:hover {
            background: #0077b5;
            box-shadow: 0 4px 14px rgba(0, 136, 204, 0.4);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="telegram-widget">
        <div class="tg-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.25-5.54 3.69-.52.36-1 .53-1.42.52-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.24.38-.49 1.03-.75 4.03-1.75 6.72-2.91 8.08-3.48 3.85-1.6 4.65-1.88 5.17-1.89.11 0 .37.03.54.17.14.12.18.28.2.45-.01.07.01.21 0 .34z" fill="#0088cc"/>
            </svg>
        </div>
        <div class="tg-content">
            <h3>Apex Telegram Notifications</h3>
            <p>Получайте мгновенные Push-уведомления о начислениях, выводах и входах в систему.</p>
            <button class="btn-apex-tg" id="connectBtn" onclick="connectTelegram()">Подключить бота</button>
        </div>
    </div>

    <script>
        async function connectTelegram() {
            const btn = document.getElementById('connectBtn');
            btn.innerText = 'Загрузка...';

            try {
                // Имитация ID текущего авторизованного пользователя
                const currentUserId = "user_12345"; 

                const response = await fetch('http://localhost:3000/api/telegram/generate-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: currentUserId })
                });

                const data = await response.json();

                if (data.success) {
                    // Открываем бота в Telegram в новой вкладке с передачей кода связки
                    window.open(data.link, '_blank');
                    btn.innerText = 'Ожидание привязки...';
                }
            } catch (err) {
                alert('Ошибка соединения с сервером');
                btn.innerText = 'Подключить бота';
            }
        }
    </script>
</body>
</html>
