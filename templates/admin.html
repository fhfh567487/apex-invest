<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель администратора</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; }
        .warning { color: red; font-size: 0.9em; }
    </style>
</head>
<body>

    <h1>Панель управления пользователями</h1>
    
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Email / Логин</th>
                <th>Пароль (Хэш)</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody>
            <!-- Запускаем цикл Flask для вывода каждого пользователя -->
            {% for user in users %}
            <tr>
                <td>{{ user.id }}</td>
                <td>{{ user.email }}</td>
                <td class="warning">{{ user.password }}</td>
                <td>
                    <button onclick="alert('Тут можно добавить функцию удаления или блокировки')">Удалить</button>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="4">В базе данных пока нет пользователей.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
