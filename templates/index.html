<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Invest — All Funds to Tesla</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.2);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --danger: #ff4d4d;
            --warning: #ffaa00;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; overflow-x: hidden; }

        /* HEADER */
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 4%; border-bottom: 1px solid rgba(255, 255, 255, 0.05); background: rgba(11, 15, 25, 0.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; gap: 10px; flex-wrap: wrap; }
        .header-left { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 10px; }
        .logo { font-size: 22px; font-weight: 800; color: var(--text-main); text-transform: uppercase; letter-spacing: 1.5px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .logo span { color: var(--accent); text-shadow: 0 0 15px var(--accent-glow); }
        .auth-buttons { display: flex; gap: 8px; }
        .auth-btn { padding: 8px 16px; font-size: 12px; font-weight: 700; border-radius: 6px; cursor: pointer; text-transform: uppercase; transition: all 0.3s ease; -webkit-tap-highlight-color: transparent; }
        .auth-btn.login { background: transparent; border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; }
        .auth-btn.login:hover { background: rgba(255, 255, 255, 0.05); }
        .auth-btn.register { background: var(--accent); border: 1px solid var(--accent); color: #000; box-shadow: 0 0 15px var(--accent-glow); }
        .auth-btn.register:hover { transform: translateY(-2px); box-shadow: 0 0 20px rgba(0, 255, 136, 0.4); }

        .user-profile { display: none; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 4px 10px; border-radius: 20px; flex-wrap: wrap; }
        .profile-avatar { width: 24px; height: 24px; background: var(--accent); color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 11px; }
        .profile-name { font-size: 12px; color: #fff; font-weight: 600; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .dashboard-nav-btn { background: rgba(0, 255, 136, 0.15); color: var(--accent); border: 1px solid var(--accent); padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; text-transform: uppercase; }
        .logout-btn { background: transparent; border: none; color: var(--danger); font-size: 11px; cursor: pointer; text-transform: uppercase; font-weight: 700; }
        .admin-nav-btn { background: var(--warning); color: #000; border: none; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; text-transform: uppercase; display: none; }

        /* HERO & STATS */
        .hero { text-align: center; padding: 60px 15px 40px; background: radial-gradient(circle at center top, rgba(0,255,136,0.1) 0%, transparent 70%); }
        .hero h1 { font-size: clamp(28px, 6vw, 48px); margin-bottom: 15px; font-weight: 800; background: linear-gradient(to right, #ffffff, #a0aec0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1.2; }
        .hero h1 span { background: linear-gradient(45deg, var(--accent), #00cc6a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 20px rgba(0, 255, 136, 0.2); }
        .hero p { color: var(--text-muted); font-size: clamp(14px, 3.5vw, 18px); max-width: 700px; margin: 0 auto; }
        .stats-section { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; max-width: 1200px; margin: 0 auto 50px; padding: 0 15px; }
        .stat-card { background: rgba(19, 27, 46, 0.6); backdrop-filter: blur(5px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; padding: 20px 10px; text-align: center; transition: transform 0.3s ease; }
        .stat-card:hover { transform: translateY(-5px); border-color: rgba(0, 255, 136, 0.2); }
        .stat-value { font-size: clamp(20px, 5vw, 32px); font-weight: 800; color: #fff; margin-bottom: 4px; }
        .stat-value.glow { color: var(--accent); text-shadow: 0 0 15px rgba(0, 255, 136, 0.3); }
        .stat-label { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }

        /* VISION SECTION */
        .vision-section { max-width: 1200px; margin: 60px auto; padding: 0 15px; }
        .vision-header { text-align: center; margin-bottom: 40px; }
        .vision-header h2 { font-size: clamp(26px, 5vw, 42px); margin-bottom: 15px; color: #fff; }
        .vision-header p { color: var(--text-muted); font-size: clamp(14px, 4vw, 16px); max-width: 800px; margin: 0 auto; }
        .accent-text { color: var(--accent); text-shadow: 0 0 15px var(--accent-glow); }
        .vision-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        .vision-card { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; overflow: hidden; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; }
        .vision-card::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; border-radius: 16px; border: 2px solid transparent; transition: all 0.4s; pointer-events: none; }
        .vision-card:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); }
        .vision-card:hover::after { border-color: rgba(0, 255, 136, 0.4); box-shadow: inset 0 0 20px rgba(0, 255, 136, 0.1); }
        .vision-img-box { width: 100%; height: 220px; overflow: hidden; position: relative; }
        .vision-img-box::before { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 50%; background: linear-gradient(to top, var(--card-bg), transparent); z-index: 1; }
        .vision-img-box img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
        .vision-card:hover .vision-img-box img { transform: scale(1.1); }
        .vision-card h3 { padding: 20px 25px 10px; font-size: 22px; color: #fff; position: relative; z-index: 2; }
        .vision-card p { padding: 0 25px 25px; color: var(--text-muted); font-size: 14px; line-height: 1.7; }
        .vision-footer { text-align: center; margin-top: 40px; background: rgba(0, 255, 136, 0.03); border: 1px solid rgba(0, 255, 136, 0.1); border-radius: 12px; padding: 25px; }
        .vision-footer p { font-size: 15px; color: #e2e8f0; font-weight: 500; }

        /* TABLES & PLANS */
        .history-section { max-width: 1200px; margin: 0 auto 50px; padding: 0 15px; }
        .section-title { text-align: center; font-size: clamp(24px, 5vw, 32px); margin-bottom: 25px; font-weight: 800; }
        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; background: var(--card-bg); border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .history-table { width: 100%; border-collapse: collapse; white-space: nowrap; }
        .history-table th, .history-table td { padding: 15px; text-align: left; font-size: 13px; }
        .history-table th { background: rgba(0, 0, 0, 0.3); color: var(--text-muted); text-transform: uppercase; font-size: 11px; letter-spacing: 1px; font-weight: 700; }
        .history-table tr:not(:last-child) td { border-bottom: 1px solid rgba(255, 255, 255, 0.03); }
        .history-table tbody tr:hover td { background: rgba(255, 255, 255, 0.02); }
        .badge-deposit { color: var(--accent); background: rgba(0, 255, 136, 0.1); padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }
        .badge-payout { color: #38bdf8; background: rgba(56, 189, 248, 0.1); padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 0 15px 40px; }
        .plans-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 30px; }
        .plan-card { background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 30px 20px; text-align: center; position: relative; transition: all 0.3s ease; }
        .plan-card:hover { transform: translateY(-5px); border-color: rgba(255, 255, 255, 0.15); }
        .plan-card.featured { border-color: var(--accent); box-shadow: 0 10px 30px rgba(0, 255, 136, 0.1); transform: scale(1.02); }
        .plan-card.featured:hover { transform: scale(1.02) translateY(-5px); box-shadow: 0 15px 40px rgba(0, 255, 136, 0.2); }
        .plan-card.featured::before { content: 'Best Value'; position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #000; font-size: 11px; font-weight: 800; padding: 5px 15px; border-radius: 20px; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 0 15px var(--accent-glow); }
        .plan-title { font-size: 24px; margin-bottom: 10px; font-weight: 700; }
        .plan-range { font-size: 26px; font-weight: 800; color: var(--accent); margin-bottom: 20px; text-shadow: 0 0 10px rgba(0, 255, 136, 0.2); }
        .plan-features { list-style: none; margin-bottom: 25px; text-align: left; }
        .plan-features li { padding: 10px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); color: var(--text-muted); font-size: 14px; display: flex; justify-content: space-between; }
        .plan-features li span { color: #fff; font-weight: 600; }
        .btn { display: inline-block; width: 100%; padding: 14px; background: var(--accent); color: #000; border: none; border-radius: 10px; font-size: 14px; font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s ease; -webkit-tap-highlight-color: transparent; }
        .btn:hover { box-shadow: 0 0 20px rgba(0, 255, 136, 0.4); transform: translateY(-2px); }

        /* DASHBOARD & ADMIN */
        .user-dashboard { display: none; max-width: 1200px; margin: 20px auto 40px; padding: 0 15px; }
        .dashboard-header { background: var(--card-bg); border: 1px solid rgba(0, 255, 136, 0.3); border-radius: 16px; padding: 25px 20px; margin-bottom: 25px; display: flex; flex-direction: column; gap: 15px; position: relative; overflow: hidden; }
        .dashboard-header::before { content: ''; position: absolute; top: 0; left: 0; width: 5px; height: 100%; background: var(--accent); box-shadow: 0 0 15px var(--accent); }
        .dashboard-user-info h2 { font-size: 20px; color: #fff; margin-bottom: 5px; word-break: break-all; }
        .dashboard-user-info p { color: var(--text-muted); font-size: 14px; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 25px; }
        .dash-card { background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 14px; padding: 20px; }
        .dash-card-title { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; font-weight: 600; letter-spacing: 0.5px; }
        .dash-card-value { font-size: 24px; font-weight: 800; color: #fff; }
        .dash-card-value.green { color: var(--accent); text-shadow: 0 0 10px rgba(0, 255, 136, 0.2); }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
        .modal { background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 25px 20px; width: 100%; max-width: 420px; position: relative; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.5); max-height: 90vh; overflow-y: auto; }
        .modal h3 { font-size: 22px; margin-bottom: 8px; color: #fff; font-weight: 700; }
        .modal p { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }
        
        .admin-section { display: none; max-width: 1200px; margin: 20px auto; padding: 20px; background: var(--card-bg); border: 1px solid var(--warning); border-radius: 16px; }
        .admin-section h2 { color: var(--warning); margin-bottom: 15px; font-size: 22px; }

        /* SUPPORT WIDGET */
        #chat-button {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 60px;
            height: 60px;
            background-color: var(--accent);
            color: #000000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.3);
            z-index: 9999;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #chat-button:hover { transform: scale(1.08); box-shadow: 0 0 25px rgba(0, 255, 136, 0.5); }

        #chat-window {
            position: fixed;
            bottom: 96px;
            right: 24px;
            width: 360px;
            height: 500px;
            background: var(--card-bg);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
            z-index: 9999;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: rgba(0, 255, 136, 0.15);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .chat-header button { background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; }

        /* СТИЛИ ПАНЕЛИ ОПЕРАТОРА (ДЛЯ binarpok@gmail.com) */
        .admin-chat-selector {
            background: #111827;
            padding: 8px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
            flex-direction: column;
            gap: 6px;
        }

        .admin-chat-selector label {
            font-size: 11px;
            color: var(--warning);
            font-weight: bold;
            text-transform: uppercase;
        }

        .admin-chat-selector select {
            width: 100%;
            padding: 6px 10px;
            background: #1f2937;
            color: #fff;
            border: 1px solid var(--warning);
            border-radius: 6px;
            font-size: 12px;
            outline: none;
        }

        .chat-body { flex: 1; padding: 14px; display: flex; flex-direction: column; overflow: hidden; background: #0b0f19; }
        .chat-logs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; padding-right: 4px; }

        .chat-msg { max-width: 82%; padding: 10px 14px; border-radius: 10px; font-size: 13px; line-height: 1.4; word-wrap: break-word; }
        .chat-msg.user { background: var(--accent); color: #000; align-self: flex-end; border-bottom-right-radius: 2px; font-weight: 600; }
        .chat-msg.admin, .chat-msg.support { background: #1e293b; color: #fff; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid rgba(255, 255, 255, 0.1); }

        .chat-action-buttons { display: flex; gap: 6px; margin-top: 8px; }
        .chat-action-btn-yes { background: var(--accent); color: #000; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; }
        .chat-action-btn-human { background: #1e293b; color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; }

        .file-upload-btn { background: transparent; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; padding: 0 6px; }
        .chat-controls { display: flex; gap: 8px; align-items: center; }
        .chat-controls input[type="text"] { flex: 1; padding: 10px 12px; background: rgba(0, 0, 0, 0.4); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; outline: none; font-size: 13px; }
        .chat-controls button#chat-send-btn { padding: 10px 16px; background: var(--accent); color: #000000; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; }

        footer { text-align: center; padding: 30px 15px; color: var(--text-muted); font-size: 13px; border-top: 1px solid rgba(255, 255, 255, 0.05); margin-top: 40px; }

        @media (min-width: 768px) {
            .stats-section { grid-template-columns: repeat(4, 1fr); }
            .dashboard-header { flex-direction: row; align-items: center; justify-content: space-between; }
            .dashboard-grid { grid-template-columns: repeat(4, 1fr); }
            .plans-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <div class="logo" onclick="toggleDashboard(false)">Apex <span>Invest</span></div>
            <div class="auth-buttons" id="authButtonsBlock">
                <button class="auth-btn login" onclick="openAuthModal('login')">Sign In</button>
                <button class="auth-btn register" onclick="openAuthModal('register')">Register</button>
            </div>
            <div class="user-profile" id="userProfileBlock">
                <div class="profile-avatar" id="profileAvatar">U</div>
                <div class="profile-name" id="profileName">user@example.com</div>
                <button class="dashboard-nav-btn" onclick="toggleDashboard()">Dashboard</button>
                <button class="admin-nav-btn" id="adminBtn" onclick="toggleAdminPanel()">Admin</button>
                <button class="logout-btn" onclick="logout()">Sign Out</button>
            </div>
        </div>
    </header>

    <!-- USER DASHBOARD SECTION -->
    <section class="user-dashboard" id="userDashboard">
        <div id="dashboardOverview">
            <div class="dashboard-header">
                <div class="dashboard-user-info">
                    <h2 id="dashUserEmail">User</h2>
                    <p>Account Status: <span style="color: var(--accent); font-weight: 600;">Active Investor</span></p>
                </div>
            </div>
            <div class="dashboard-grid">
                <div class="dash-card">
                    <div class="dash-card-title">Available Balance</div>
                    <div class="dash-card-value green" id="userBalance">$0.00</div>
                </div>
            </div>
        </div>
    </section>

    <!-- MAIN PAGE CONTENT -->
    <div id="mainPageContent">
        <section class="hero">
            <h1>Capital of the Future.<br>Investing in <span>Tesla Motors</span></h1>
        </section>
    </div>

    <!-- SUPPORT CHAT WIDGET -->
    <div id="chat-button" onclick="toggleSupportChat()">💬</div>

    <div id="chat-window">
        <div class="chat-header">
            <span id="chatTitleText">Служба поддержки Apex</span>
            <button onclick="toggleSupportChat()">✕</button>
        </div>

        <!-- Панель администратора (показывается только для binarpok@gmail.com) -->
        <div class="admin-chat-selector" id="adminChatSelector">
            <label>⚡ Панель Оператора (binarpok)</label>
            <select id="userChatDropdown" onchange="switchAdminTargetChat(this.value)">
                <option value="">-- Выберите чат пользователя --</option>
            </select>
        </div>

        <div class="chat-body">
            <div class="chat-logs" id="chatLogs"></div>
            <div class="chat-controls">
                <input type="file" id="chat-file-input" accept="image/*" style="display: none;" onchange="handleImageSelect(this)">
                <button type="button" class="file-upload-btn" onclick="document.getElementById('chat-file-input').click()" title="Прикрепить файл">📎</button>
                <input type="text" id="chat-message" placeholder="Введите сообщение..." onkeydown="if(event.key==='Enter') sendSupportMessage()">
                <button id="chat-send-btn" onclick="sendSupportMessage()">Отправить</button>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_EMAIL = 'binarpok@gmail.com';
        let currentActiveUserSession = ''; 
        let isBinarpokAdmin = false;

        function initChatSession() {
            let loggedEmail = localStorage.getItem('apex_logged_user');
            
            if (loggedEmail && loggedEmail.trim().toLowerCase() === ADMIN_EMAIL) {
                isBinarpokAdmin = true;
                document.getElementById('adminChatSelector').style.display = 'flex';
                document.getElementById('chatTitleText').innerText = '👨‍💻 Админ-Поддержка (Apex)';
                loadAllUserChatsForAdmin();
            } else {
                isBinarpokAdmin = false;
                document.getElementById('adminChatSelector').style.display = 'none';
                currentActiveUserSession = loggedEmail || localStorage.getItem('chat_session_id') || ('anon_' + Math.random().toString(36).substr(2, 9));
                localStorage.setItem('chat_session_id', currentActiveUserSession);
                loadChatHistory(currentActiveUserSession);
            }
        }

        function loadAllUserChatsForAdmin() {
            const dropdown = document.getElementById('userChatDropdown');
            dropdown.innerHTML = '<option value="">-- Выберите чат пользователя --</option>';

            for (let i = 0; i < localStorage.length; i++) {
                let key = localStorage.key(i);
                if (key.startsWith('chat_history_')) {
                    let userChatId = key.replace('chat_history_', '');
                    let option = document.createElement('option');
                    option.value = userChatId;
                    option.innerText = '💬 Чат: ' + userChatId;
                    dropdown.appendChild(option);
                }
            }
        }

        function switchAdminTargetChat(targetUserSession) {
            if (!targetUserSession) return;
            currentActiveUserSession = targetUserSession;
            loadChatHistory(targetUserSession);
        }

        function loadChatHistory(sessionId) {
            const container = document.getElementById('chatLogs');
            container.innerHTML = '';

            let rawHistory = localStorage.getItem('chat_history_' + sessionId);
            let history = rawHistory ? JSON.parse(rawHistory) : [];

            if (history.length === 0 && !isBinarpokAdmin) {
                history.push({
                    sender: 'admin',
                    text: '👨‍💻 Поддержка: 💰 **Как вывести средства:** 1. Перейдите в раздел Dashboard. 2. Пройдите KYC. 3. Нажмите «Request Withdrawal».\n\nВаша проблема решена?',
                    showButtons: true
                });
                localStorage.setItem('chat_history_' + sessionId, JSON.stringify(history));
            }

            history.forEach(item => {
                renderChatMessage(item);
            });
        }

        function renderChatMessage(item) {
            const container = document.getElementById('chatLogs');
            const div = document.createElement('div');
            div.className = 'chat-msg ' + (item.sender === 'user' ? 'user' : 'admin');

            let formattedText = (item.text || '').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
            let senderPrefix = item.sender === 'admin' ? '👨‍💻 Поддержка: ' : '';

            div.innerHTML = `<div>${senderPrefix}${formattedText}</div>`;

            if (item.showButtons && !isBinarpokAdmin) {
                const btnBox = document.createElement('div');
                btnBox.className = 'chat-action-buttons';
                btnBox.innerHTML = `
                    <button class="chat-action-btn-yes" onclick="handleActionClick('solved_yes')">Да</button>
                    <button class="chat-action-btn-human" onclick="handleActionClick('call_human')">Позвать человека</button>
                `;
                div.appendChild(btnBox);
            }

            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function sendSupportMessage() {
            const input = document.getElementById('chat-message');
            const text = input.value.trim();
            if (!text || !currentActiveUserSession) return;

            input.value = '';

            let rawHistory = localStorage.getItem('chat_history_' + currentActiveUserSession);
            let history = rawHistory ? JSON.parse(rawHistory) : [];

            if (isBinarpokAdmin) {
                let newMsg = { sender: 'admin', text: text };
                history.push(newMsg);
                localStorage.setItem('chat_history_' + currentActiveUserSession, JSON.stringify(history));
                renderChatMessage(newMsg);
            } else {
                let newMsg = { sender: 'user', text: text };
                history.push(newMsg);

                const lower = text.toLowerCase();
                if (lower === 'нет' || lower === 'нет.') {
                    history.push({
                        sender: 'admin',
                        text: 'Сожалеем, что проблема не решена. Нажмите кнопку ниже, чтобы подключить администратора.',
                        showButtons: true
                    });
                } else if (lower === 'да' || lower === 'да.') {
                    history.push({ sender: 'admin', text: 'Рады были помочь! Обращайтесь, если появятся вопросы.' });
                } else {
                    history.push({ sender: 'admin', text: 'Запрос принят. Чем еще вам помочь?', showButtons: true });
                }

                localStorage.setItem('chat_history_' + currentActiveUserSession, JSON.stringify(history));
                loadChatHistory(currentActiveUserSession);
            }
        }

        function handleActionClick(actionType) {
            if (actionType === 'solved_yes') {
                sendSupportMessageText('Да');
            } else if (actionType === 'call_human') {
                sendSupportMessageText('Позвать человека');
            }
        }

        function sendSupportMessageText(text) {
            document.getElementById('chat-message').value = text;
            sendSupportMessage();
        }

        function toggleSupportChat() {
            const win = document.getElementById('chat-window');
            win.style.display = (win.style.display === 'flex') ? 'none' : 'flex';
            if (win.style.display === 'flex') {
                initChatSession();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            let savedUser = localStorage.getItem('apex_logged_user');
            if (savedUser) {
                if (savedUser.trim().toLowerCase() === ADMIN_EMAIL) {
                    document.getElementById('adminBtn').style.display = 'inline-block';
                }
            }
        });
    </script>
</body>
</html>
